<app-layout pageTitle="Profile">
  <section
    hlmCard
    class="bg-surface-container-lowest border-border-subtle max-w-3xl mx-auto rounded-xl border p-6 shadow-sm sm:p-8"
  >
    <div hlmCardHeader class="border-border-subtle mb-6 border-b p-0 pb-4">
      <h3 hlmCardTitle class="font-heading text-on-surface text-xl font-bold">
        Profile & Preferences
      </h3>
      <p class="text-on-surface-variant mt-1 text-sm">
        Manage your personal information, workspace settings, and notification preferences.
      </p>
    </div>
    <div class="space-y-4">
      <div>
        <label
          class="text-on-surface-variant mb-1 block text-xs font-semibold tracking-wider uppercase"
          >Full Name</label
        >
        <div
          class="text-on-surface bg-surface-container-low border-border-subtle/60 flex min-h-[42px] items-center rounded-md border px-3 py-2 text-base font-medium"
        >
          @if (currentUser()) { {{ currentUser()?.name }} } @else {
          <hlm-skeleton class="h-5 w-48 rounded" />
          }
        </div>
      </div>
      <div>
        <label
          class="text-on-surface-variant mb-1 block text-xs font-semibold tracking-wider uppercase"
          >Email Address</label
        >
        <div
          class="text-on-surface bg-surface-container-low border-border-subtle/60 flex min-h-[42px] items-center rounded-md border px-3 py-2 text-base font-medium"
        >
          @if (currentUser()) { {{ currentUser()?.email }} } @else {
          <hlm-skeleton class="h-5 w-56 rounded" />
          }
        </div>
      </div>
    </div>
  </section>
</app-layout>
